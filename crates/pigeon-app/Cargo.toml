[package]
name = "pigeon-app"
description = "Pigeon: press a hotkey on any reel or post and send it to anyone from a round glass panel."
# Pigeon was called Fling until v0.3.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Pigeon"
path = "src/main.rs"

[dependencies]
pigeon-core = { path = "../pigeon-core" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No Tauri plugins on purpose: the panel can only call the handful of
# commands defined in src/main.rs.
tauri = { version = "2.12.5", features = ["tray-icon", "custom-protocol"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = "2.7.4"
