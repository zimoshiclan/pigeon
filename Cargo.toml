[workspace]
resolver = "3"
members = ["crates/pigeon-core", "crates/pigeon-cli", "crates/pigeon-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/zimoshiclan/pigeon"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
